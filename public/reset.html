<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | StarWave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-body">
              <h4 class="mb-3">Reset Password</h4>
              <p class="text-muted">Enter your new password below.</p>
              <input type="hidden" id="resetToken" />
              <div class="mb-3">
                <input type="password" id="resetPwd" class="form-control" placeholder="New Password" required />
              </div>
              <div class="mb-3">
                <input type="password" id="resetPwdConfirm" class="form-control" placeholder="Confirm Password" required />
              </div>
              <button class="btn btn-primary w-100" id="resetSubmitBtn">Reset Password</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      $(function(){
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        if (!token) { alert('Invalid reset link'); return; }
        $('#resetToken').val(token);
        $('#resetSubmitBtn').click(function(){
          const pwd = $('#resetPwd').val();
          const cpwd = $('#resetPwdConfirm').val();
          if (!pwd || !cpwd || pwd !== cpwd) { alert('Passwords must match'); return; }
          $.post('/auth/reset-password', { token, newPwd: pwd })
            .done(function(resp){ alert(resp.message || 'Password reset successful'); window.location.href = '/index.html'; })
            .fail(function(jq){ alert(jq.responseJSON && jq.responseJSON.message ? jq.responseJSON.message : 'Password reset failed'); });
        });
      });
    </script>
  </body>
  </html>
